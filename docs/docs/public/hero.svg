<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Document Gradients -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <!-- Nitro Bottle Gradients -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Scanner Gradients -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-scan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#glow)" />

  <g transform="translate(40, 20)">
    <!-- Document Behind -->
    <g filter="url(#shadow-lg)" transform="rotate(-8, 200, 250)">
      <!-- Main Paper -->
      <path d="M 120 70 L 280 70 L 340 130 L 340 400 A 15 15 0 0 1 325 415 L 135 415 A 15 15 0 0 1 120 400 Z" fill="url(#docGrad)" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Fold -->
      <path d="M 280 70 L 280 130 L 340 130 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Text Lines on Document -->
      <rect x="160" y="150" width="120" height="12" rx="6" fill="#94a3b8" opacity="0.4"/>
      <rect x="160" y="180" width="140" height="12" rx="6" fill="#94a3b8" opacity="0.4"/>
      <rect x="160" y="210" width="100" height="12" rx="6" fill="#94a3b8" opacity="0.4"/>
      
      <!-- Image placeholder on document -->
      <rect x="160" y="250" width="140" height="100" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="230" cy="300" r="20" fill="#cbd5e1"/>
      <path d="M 160 350 L 200 300 L 250 340 L 270 310 L 300 350" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Scanner Laser -->
    <g transform="translate(0, 50)">
      <rect x="90" y="160" width="280" height="4" fill="#10b981" filter="url(#glow-scan)"/>
      <rect x="90" y="160" width="280" height="120" fill="url(#scanGrad)"/>
    </g>

    <!-- Nitro Bottle (overlapping) -->
    <g transform="translate(200, 190) scale(0.65)" filter="url(#shadow-lg)">
      <!-- Top parts -->
      <rect x="100" y="30" width="80" height="40" fill="#e2e8f0" stroke="#1e293b" stroke-width="8"/>
      <rect x="60" y="50" width="160" height="16" fill="#e2e8f0" stroke="#1e293b" stroke-width="8" rx="4"/>
      <!-- Neck -->
      <path d="M 110 70 L 170 70 L 190 120 L 90 120 Z" fill="url(#bottleGrad)" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>
      <!-- Body -->
      <rect x="80" y="120" width="120" height="190" rx="20" fill="url(#bottleGrad)" stroke="#1e293b" stroke-width="8"/>
      
      <!-- Label -->
      <rect x="80" y="160" width="120" height="85" fill="url(#labelGrad)" stroke="#1e293b" stroke-width="8"/>
      <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="50" fill="#ffffff" text-anchor="middle" letter-spacing="1">N2O</text>
      
      <!-- Gauge -->
      <circle cx="180" cy="110" r="35" fill="#f8fafc" stroke="#1e293b" stroke-width="8"/>
      <!-- Gauge inner arc -->
      <path d="M 155 110 A 25 25 0 0 1 205 110" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <path d="M 155 110 A 25 25 0 0 1 170 87" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
      <!-- Needle -->
      <path d="M 180 110 L 195 90" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
      <circle cx="180" cy="110" r="6" fill="#1e293b"/>
      
      <!-- Highlights -->
      <path d="M 95 130 L 95 290" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
      <path d="M 185 130 L 185 290" stroke="#000000" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
    </g>
  </g>
</svg>
